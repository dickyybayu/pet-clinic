{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Perbarui Jenis Hewan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
      background-color: #f0f2f5;
      padding: 40px;
    }
    .form-container {
      background-color: white;
      max-width: 500px;
      margin: 60px auto;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      border: 2px solid #ccc;
    }
    h4 {
      color: #002147;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
    }
    .btn-primary-custom {
      background-color: #0d47a1;
      color: white;
      padding: 10px 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s, transform 0.3s;
    }
    .btn-primary-custom:hover {
      background-color: #08306b;
      transform: translateY(-2px);
    }
    .btn-cancel {
      background-color: #ccc;
      color: #002147;
      padding: 10px 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h4>Perbarui Jenis Hewan</h4>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="idJenis" class="form-label">ID Jenis Hewan</label>
        <input type="text" id="idJenis" class="form-control" value="{{ jenis.id }}" readonly />
      </div>
      <div class="mb-3">
        <label for="namaJenis" class="form-label">Nama Jenis</label>
        <input type="text" id="namaJenis" name="nama" class="form-control" value="{{ jenis.nama }}" required />
      </div>
      <div class="d-flex justify-content-end">
        <a href="{% url 'kuning:jenis_list' %}" class="btn btn-cancel">Batal</a>
        <button type="submit" class="btn btn-primary-custom">Perbarui</button>
      </div>
    </form>
  </div>
</body>
</html>
