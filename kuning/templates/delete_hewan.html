<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hapus Hewan Peliharaan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
      background-color: #f0f2f5;
      padding: 40px;
    }
    .delete-container {
      background-color: white;
      max-width: 500px;
      margin: 80px auto;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      border: 2px solid #ccc;
      text-align: center;
    }
    h4 {
      font-size: 26px;
      color: #b00020;
      font-weight: bold;
      margin-bottom: 20px;
    }
    p {
      font-size: 16px;
      color: #333;
      margin-bottom: 30px;
    }
    .btn-cancel {
      background-color: #ccc;
      color: #002147;
      padding: 10px 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      margin-right: 10px;
    }
    .btn-danger-custom {
      background-color: #b00020;
      color: white;
      padding: 10px 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s, transform 0.3s;
    }
    .btn-danger-custom:hover {
      background-color: #a3001c;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="delete-container">
    <h4>Konfirmasi Penghapusan</h4>
    <p>Apakah kamu yakin ingin menghapus hewan peliharaan bernama <strong class="text-danger">{{ hewan.nama }}</strong> dengan ID <strong class="text-danger">{{ hewan.id }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-center">
        <a href="{% url 'kuning:hewan_list' %}" class="btn btn-cancel">Batal</a>
        <button type="submit" class="btn btn-danger-custom">Hapus</button>
      </div>
    </form>
  </div>
</body>
</html>
