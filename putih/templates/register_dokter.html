{% extends 'auth_base.html' %}

{% block title %}Register - Dokter Hewan{% endblock %}

{% block content %}
<div class="auth-container">
  <h2>Form Register - Dokter Hewan</h2>

  <h3>Informasi Umum</h3>

  <form method="post" action="#">
    {% csrf_token %}
    <div class="form-group">
      <label>Nomor Izin Praktik <span class="required">*</span></label>
      <input type="text" name="nip" required>
    </div>

    <div class="form-group">
      <label>Email <span class="required">*</span></label>
      <input type="email" name="email" required>
    </div>

    <div class="form-group">
      <label>Password <span class="required">*</span></label>
      <input type="password" name="password" required>
    </div>

    <div class="form-group">
      <label>Nomor Telepon <span class="required">*</span></label>
      <input type="text" name="phone" required>
    </div>

    <div class="form-group">
      <label>Tanggal Diterima <span class="required">*</span></label>
      <input type="date" name="start_date" required>
    </div>

    <div class="form-group">
      <label>Alamat <span class="required">*</span></label>
      <textarea name="address" required></textarea>
    </div>

    <h3>Kompetensi</h3>

    <div id="sertifikat-container" class="dynamic-group">
      <div class="form-group">
        <label>Nomor Sertifikat <span class="required">*</span></label>
        <input type="text" name="sertifikat_no[]" required>
      </div>

      <div class="form-group">
        <label>Nama Sertifikat <span class="required">*</span></label>
        <input type="text" name="sertifikat_name[]" required>
      </div>
    </div>

    <button type="button" class="auth-button-small" onclick="addSertifikat()">+ Tambah Sertifikat</button>

    <h3>Jadwal Praktik</h3>

    <div id="jadwal-container" class="dynamic-group">
      <div class="form-group">
        <label>Hari <span class="required">*</span></label>
        <input type="text" name="jadwal_day[]" required>
      </div>

      <div class="form-group">
        <label>Jam <span class="required">*</span></label>
        <input type="time" name="jadwal_time[]" required>
      </div>
    </div>

    <button type="button" class="auth-button-small" onclick="addJadwal()">+ Tambah Jadwal</button>

    <br><br>
    <button type="submit" class="auth-button">Register</button>
  </form>
</div>

<script>
function addSertifikat() {
  const html = `
    <div class="dynamic-group">
      <div class="form-group">
        <label>Nomor Sertifikat <span class="required">*</span></label>
        <input type="text" name="sertifikat_no[]" required>
      </div>
      <div class="form-group">
        <label>Nama Sertifikat <span class="required">*</span></label>
        <input type="text" name="sertifikat_name[]" required>
      </div>
    </div>
  `;
  document.getElementById("sertifikat-container").insertAdjacentHTML('beforeend', html);
}

function addJadwal() {
  const html = `
    <div class="dynamic-group">
      <div class="form-group">
        <label>Hari <span class="required">*</span></label>
        <input type="text" name="jadwal_day[]" required>
      </div>
      <div class="form-group">
        <label>Jam <span class="required">*</span></label>
        <input type="time" name="jadwal_time[]" required>
      </div>
    </div>
  `;
  document.getElementById("jadwal-container").insertAdjacentHTML('beforeend', html);
}
</script>
{% endblock %}
