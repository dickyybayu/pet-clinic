<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Update Profile Perawat Hewan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            margin: 30px 20px;
            padding: 30px;
            overflow: hidden;
        }
        h2 {
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-cancel, .btn-update {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-cancel {
            background-color: #f0f2f5;
            color: #4a5568;
            border: 1px solid #d1d5db;
        }
        .btn-update {
            background-color: #5a85e2;
            color: white;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Update Profile Perawat Hewan</h2>

    <label for="sertifikat_kompetensi_perawat">Sertifikat Kompetensi</label>
    <input type="text" id="sertifikat_kompetensi_perawat" placeholder="Sertifikat Kompetensi Perawat Hewan" required>

    <label for="tanggal_akhir_kerja">Tanggal Akhir Kerja</label>
    <input type="text" id="tanggal_akhir_kerja" placeholder="Tanggal Akhir Kerja Perawat Hewan" required>

    <div class="button-group">
        <button type="button" class="btn-cancel">Cancel</button>
        <button type="submit" class="btn-update">Update</button>
    </div>
</div>

</body>
</html>
