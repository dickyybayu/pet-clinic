<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Update Profile Klien Perusahaan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
    }
    .container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
    }
    .form-card {
      width: 100%;
      max-width: 600px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 30px;
      margin: 30px 20px;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #4a5568;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .button-group {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn-cancel,
    .btn-update {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    .btn-cancel {
      background-color: #f0f2f5;
      color: #4a5568;
      border: 1px solid #d1d5db;
    }
    .btn-update {
      background-color: #5a85e2;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-card">
      <h2>Update Profile Klien Perusahaan</h2>

      <form method="POST">
        {% csrf_token %}
        <label for="nama_perusahaan">Nama Perusahaan</label>
        <input type="text" id="nama_perusahaan" name="nama_perusahaan" placeholder="Nama Perusahaan Klien Perusahaan" required>

        <label for="nomor_telepon">Nomor Telepon</label>
        <input type="text" id="nomor_telepon" name="nomor_telepon" placeholder="Nomor Telepon Klien Perusahaan" required>

        <div class="button-group">
          <a href="#" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-update">Update</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
