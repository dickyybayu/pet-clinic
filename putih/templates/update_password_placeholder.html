<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Update Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-cancel, .btn-update {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-cancel {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
        }
        .btn-update {
            background-color: #0d1117;
            color: white;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Update Password</h2>

    <label for="password_lama">Password Lama *</label>
    <input type="password" id="password_lama" placeholder="Password Lama" required>

    <label for="password_baru">Password Baru *</label>
    <input type="password" id="password_baru" placeholder="Password Baru" required>

    <label for="konfirmasi_password_baru">Konfirmasi Password Baru *</label>
    <input type="password" id="konfirmasi_password_baru" placeholder="Konfirmasi Password Baru" required>

    <div class="button-group">
        <button type="button" class="btn-cancel">Cancel</button>
        <button type="submit" class="btn-update">Update Password</button>
    </div>
</div>

</body>
</html>
