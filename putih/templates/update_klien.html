{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
  .container {
    max-width: 800px;
    margin: 120px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.08);
  }

  h2 {
    color: #2d3748;
    margin-bottom: 25px;
  }

  label {
    display: block;
    margin-top: 20px;
    font-weight: 600;
    font-size: 14px;
    color: #374151;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }

  .button-group {
    margin-top: 30px;
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  .btn-cancel, .btn-submit {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }

  .btn-cancel {
    background-color: #f0f2f5;
    color: #374151;
    border: 1px solid #ccc;
  }

  .btn-submit {
    background-color: #5a85e2;
    color: white;
  }
</style>

<div class="container">
  <h2>Update Profil Klien</h2>

  <form method="POST">
    {% csrf_token %}
    <label for="alamat">Alamat</label>
    <input type="text" id="alamat" name="alamat" value="{{ data.alamat }}" required>

    <label for="nomor_telepon">Nomor Telepon</label>
    <input type="text" id="nomor_telepon" name="nomor_telepon" value="{{ data.nomor_telepon }}" required>

    {% if logged_user.role == 'klien_individu' %}
      <label for="nama_depan">Nama Depan</label>
      <input type="text" id="nama_depan" name="nama_depan" value="{{ data.nama_depan }}" required>

      <label for="nama_tengah">Nama Tengah</label>
      <input type="text" id="nama_tengah" name="nama_tengah" value="{{ data.nama_tengah }}">

      <label for="nama_belakang">Nama Belakang</label>
      <input type="text" id="nama_belakang" name="nama_belakang" value="{{ data.nama_belakang }}" required>
    {% elif logged_user.role == 'klien_perusahaan' %}
      <label for="nama_perusahaan">Nama Perusahaan</label>
      <input type="text" id="nama_perusahaan" name="nama_perusahaan" value="{{ data.nama_perusahaan }}" required>
    {% endif %}

    <div class="button-group">
      <a href="{% url 'putih:show_profile' %}" class="btn-cancel">Batal</a>
      <button type="submit" class="btn-submit">Simpan</button>
    </div>
  </form>
</div>
{% endblock %}
