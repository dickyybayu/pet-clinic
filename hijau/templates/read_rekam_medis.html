{% include "navbar.html" %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Rekam Medis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      padding-top: 80px;
      background-color: #f5f7fa;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: start;
      padding: 40px 20px;
    }

    .rekam-medis-card {
      width: 100%;
      max-width: 700px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 30px;
      position: relative;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
      color: #4a5568;
    }

    .btn-update {
      position: absolute;
      top: 30px;
      right: 30px;
      background-color: #5a85e2;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }

    .data-row {
      display: flex;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .label {
      width: 180px;
      font-weight: 600;
      color: #374151;
    }

    .value {
      flex: 1;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="rekam-medis-card">
      <h2>Rekam Medis</h2>
      
      <div style="margin-top: 30px;">
        <div class="data-row">
          <div class="label">Suhu Tubuh</div>
          <div class="value">36.8°C</div>
        </div>
        <div class="data-row">
          <div class="label">Berat Badan</div>
          <div class="value">12.3 kg</div>
        </div>
        <div class="data-row">
          <div class="label">Jenis Perawatan</div>
          <div class="value">Vaksinasi</div>
        </div>
        <div class="data-row" style="align-items: flex-start;">
          <div class="label">Catatan Medis</div>
          <div class="value">
            Hewan dalam kondisi sehat, diberikan vaksin rabies dosis standar, tidak ada reaksi alergi setelah penyuntikan.
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
