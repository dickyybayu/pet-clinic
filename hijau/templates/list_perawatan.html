{% include "navbar.html" %}

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>List Perawatan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      padding-top: 80px;
      background-color: #f5f7fa;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    h2 {
      color: #4a5568;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #eee;
      padding: 14px;
      text-align: center;
    }

    th {
      background-color: #f9fafb;
      font-weight: 600;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>List Perawatan Hewan</h2>

    <table>
      <thead>
        <tr>
          <th>Kode Perawatan</th>
          <th>Nama Perawatan</th>
          <th>Biaya Perawatan</th>
        </tr>
      </thead>
      <tbody>
        {% for p in perawatan %}
        <tr>
            <td>{{ p.kode_perawatan }}</td>
            <td>{{ p.nama_perawatan }}</td>
            <td>Rp{{ p.biaya_perawatan }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3">Belum ada data perawatan tersedia.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
