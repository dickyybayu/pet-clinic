{% include "navbar.html" %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Update Kunjungan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
    }
    .container {
      max-width: 600px;
      margin: 80px auto;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 30px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #4a5568;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
      margin-bottom: 8px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[readonly] {
      background-color: #f9fafb;
      color: #4b5563;
    }
    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 30px;
    }
    .cancel-btn, .update-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }
    .cancel-btn {
      background-color: #f0f2f5;
      color: #4a5568;
      border: 1px solid #d1d5db;
    }
    .update-btn {
      background-color: #5a85e2;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Update Kunjungan</h1>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label for="idKlien">ID Klien</label>
        <select id="idKlien" name="id_klien">
          <option value="FDO123" selected>FDO123</option>
          <option value="KI123">KI123</option>
          <option value="PKE123">PKE123</option>
        </select>
      </div>

      <div class="form-group">
        <label for="namaHewan">Nama Hewan</label>
        <select id="namaHewan" name="nama_hewan">
          <option value="Snowy" selected>Snowy</option>
          <option value="Blacky">Blacky</option>
          <option value="Hamstrong">Hamstrong</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dokterHewan">Dokter Hewan</label>
        <select id="dokterHewan" name="dokter_hewan">
          <option value="Dr. Rizki" selected>Dr. Rizki</option>
          <option value="Dr. Safira">Dr. Safira</option>
          <option value="Dr. Nainu">Dr. Nainu</option>
        </select>
      </div>

      <div class="form-group">
        <label for="perawatHewan">Perawat Hewan</label>
        <select id="perawatHewan" name="perawat_hewan">
          <option value="Tina" selected>Tina</option>
          <option value="Tini">Tini</option>
          <option value="Tono">Tono</option>
        </select>
      </div>

      <div class="form-group">
        <label for="metodeKunjungan">Metode Kunjungan</label>
        <select id="metodeKunjungan" name="metode_kunjungan">
          <option value="Janji Temu" selected>Janji Temu</option>
          <option value="Walk-In">Walk-In</option>
          <option value="Darurat">Darurat</option>
        </select>
      </div>

      <div class="form-group">
        <label for="waktuMulai">Waktu Mulai Penanganan</label>
        <input type="text" id="waktuMulai" name="waktu_mulai" value="03-04-2025 14:30:13" readonly>
      </div>

      <div class="form-group">
        <label for="waktuSelesai">Waktu Selesai Penanganan</label>
        <input type="text" id="waktuSelesai" name="waktu_selesai" value="03-04-2025 16:30:16" readonly>
      </div>

      <div class="buttons">
        <a href="{% url 'hijau:list_kunjungan' %}" class="cancel-btn">Cancel</a>
        <button type="submit" class="update-btn">Update</button>
      </div>
    </form>
  </div>
</body>
</html>
