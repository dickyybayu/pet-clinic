<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>List Hewan Peliharaan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        h2 {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f8f8f8;
        }
        .action-buttons button {
            margin: 0 5px;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
        .update-button {
            background-color: #2c3e50;
        }
        .delete-button {
            background-color: #e74c3c;
        }
        .create-button {
            background-color: #2c3e50;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 6px;
            float: right;
        }
        img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>List Hewan Peliharaan</h2>
        <a href="#" class="create-button">+ Create New Pet</a>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Pemilik</th>
                    <th>Jenis Hewan</th>
                    <th>Nama Hewan</th>
                    <th>Tanggal Lahir</th>
                    <th>Foto</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>John Doe</td>
                    <td>Kucing</td>
                    <td>Snowy</td>
                    <td>9 Februari 2020</td>
                    <td><img src="foto1.jpg" alt="Snowy"></td>
                    <td class="action-buttons">
                        <button class="update-button">Update</button>
                        <button class="delete-button">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>PT Aku Sayang Hewan</td>
                    <td>Anjing</td>
                    <td>Blacky</td>
                    <td>15 November 2019</td>
                    <td><img src="foto2.jpg" alt="Blacky"></td>
                    <td class="action-buttons">
                        <button class="update-button">Update</button>
                        <button class="delete-button">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>PT Pecinta Kucing</td>
                    <td>Hamster</td>
                    <td>Hamseung</td>
                    <td>15 Oktober 2024</td>
                    <td><img src="foto3.jpg" alt="Hamseung"></td>
                    <td class="action-buttons">
                        <button class="update-button">Update</button>
                        <button class="delete-button">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
