{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.08); margin-top: 80px;">
  <h2 style="color: #2d3748; margin-bottom: 25px;">Buat Kunjungan Baru</h2>

  <form method="POST">
    {% csrf_token %}

    <label for="no_identitas_klien" style="display:block; margin-top:20px; font-weight:600; font-size:14px; color:#374151;">ID Klien</label>
    <select id="no_identitas_klien" name="no_identitas_klien" required onchange="fetchHewan(this.value)" style="width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:6px;">
      <option value="">-- Pilih Klien --</option>
      {% for klien in daftar_klien %}
        <option value="{{ klien.no_identitas }}">{{ klien.no_identitas }} - {{ klien.nama }}</option>
      {% endfor %}
    </select>

    <label for="nama_hewan" style="display:block; margin-top:20px; font-weight:600; font-size:14px; color:#374151;">Nama Hewan</label>
    <select id="nama_hewan" name="nama_hewan" required style="width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:6px;">
      <option value="">-- Pilih Klien terlebih dahulu --</option>
    </select>

    <label for="no_dokter_hewan" style="display:block; margin-top:20px; font-weight:600; font-size:14px; color:#374151;">Dokter Hewan</label>
    <select id="no_dokter_hewan" name="no_dokter_hewan" required style="width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:6px;">
      {% for dokter in daftar_dokter %}
        <option value="{{ dokter.no_dokter_hewan }}">{{ dokter.email }}</option>
      {% endfor %}
    </select>

    <label for="no_perawat_hewan" style="display:block; margin-top:20px; font-weight:600; font-size:14px; color:#374151;">Perawat Hewan</label>
    <select id="no_perawat_hewan" name="no_perawat_hewan" required style="width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:6px;">
      {% for perawat in daftar_perawat %}
        <option value="{{ perawat.no_perawat_hewan }}">{{ perawat.email }}</option>
      {% endfor %}
    </select>

    <label for="tipe_kunjungan" style="display:block; margin-top:20px; font-weight:600; font-size:14px; color:#374151;">Metode Kunjungan</label>
    <select id="tipe_kunjungan" name="tipe_kunjungan" required style="width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:6px;">
      <option value="Janji Temu">Janji Temu</option>
      <option value="Walk-In">Walk-In</option>
      <option value="Darurat">Darurat</option>
    </select>

    <label for="timestamp_awal" style="display:block; margin-top:20px; font-weight:600; font-size:14px; color:#374151;">Waktu Mulai Penanganan</label>
    <input type="datetime-local" name="timestamp_awal" required style="width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:6px;">

    <label for="timestamp_akhir" style="display:block; margin-top:20px; font-weight:600; font-size:14px; color:#374151;">Waktu Akhir Penanganan (opsional)</label>
    <input type="datetime-local" name="timestamp_akhir" style="width:100%; padding:10px; margin-top:8px; border:1px solid #ccc; border-radius:6px;">

    <div class="button-group" style="margin-top:30px; display:flex; justify-content:flex-end; gap:12px;">
      <a href="{% url 'hijau:list_kunjungan' %}" class="btn-cancel" style="background-color:#f0f2f5; color:#374151; padding:10px 20px; border-radius:6px; text-decoration:none; border:1px solid #ccc;">Batal</a>
      <button type="submit" class="btn-submit" style="background-color:#5a85e2; color:white; padding:10px 20px; border-radius:6px; border:none;">Simpan</button>
    </div>
  </form>
</div>

<script>
  function fetchHewan(no_identitas) {
    const dropdown = document.getElementById("nama_hewan");
    dropdown.innerHTML = "<option value=''>Memuat...</option>";

    fetch(`/hijau/api/hewan/${no_identitas}/`)
      .then(response => response.json())
      .then(data => {
        dropdown.innerHTML = "";
        if (data.length === 0) {
          dropdown.innerHTML = "<option value=''>Tidak ada hewan terdaftar</option>";
          return;
        }
        data.forEach(hewan => {
          const option = document.createElement("option");
          option.value = hewan.nama;
          option.textContent = hewan.nama;
          dropdown.appendChild(option);
        });
      })
      .catch(() => {
        dropdown.innerHTML = "<option value=''>Gagal memuat data</option>";
      });
  }
</script>
{% endblock %}
