{% include "navbar.html" %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Buat Kunjungan</title>
  <style>
    body { font-family: Arial; background-color: #f5f7fa; padding-top: 80px; }
    .container {
      max-width: 700px; margin: auto; background: white; padding: 30px;
      border-radius: 10px; box-shadow: 0 2px 20px rgba(0,0,0,0.1);
    }
    h2 { color: #4a5568; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-top: 15px; }
    input, select {
      width: 100%; padding: 10px; margin-top: 5px;
      border-radius: 6px; border: 1px solid #ccc;
    }
    button {
      margin-top: 20px; background-color: #5a85e2;
      color: white; padding: 10px 20px; border: none;
      border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Formulir Kunjungan Baru</h2>

    <form method="POST">
      {% csrf_token %}
      <label>Nama Hewan</label>
      <input type="text" name="nama_hewan" required>

      <label>ID Klien</label>
      <input type="text" name="no_identitas_klien" required>

      <label>ID Perawat Hewan</label>
      <input type="text" name="no_perawat_hewan" required>

      <label>ID Dokter Hewan</label>
      <input type="text" name="no_dokter_hewan" required>

      <label>Tipe Kunjungan</label>
      <select name="tipe_kunjungan" required>
        <option value="vaksin">Vaksin</option>
        <option value="perawatan">Perawatan</option>
        <option value="lainnya">Lainnya</option>
      </select>

      <label>Kode Vaksin (opsional)</label>
      <input type="text" name="kode_vaksin">

      <label>Waktu Mulai</label>
      <input type="datetime-local" name="timestamp_awal" required>

      <!-- <label>Suhu (opsional)</label>
      <input type="number" name="suhu">

      <label>Berat Badan (opsional)</label>
      <input type="number" step="0.01" name="berat_badan">

      <label>Catatan (opsional)</label>
      <textarea name="catatan" rows="4"></textarea> -->

      <button type="submit">Simpan</button>
    </form>
  </div>
</body>
</html>
