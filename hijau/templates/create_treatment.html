{%include "navbar.html"%}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Create New Treatment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 80px;
            background-color: #fff;
        }
        .form-container {
            border: 2px solid black;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            background-color: white;
        }
        h2 {
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select, textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea {
            height: 80px;
            resize: none;
        }
        .button-group {
            margin-top: 30px;
            text-align: right;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-cancel {
            background-color: white;
            color: black;
            border: 1px solid black;
        }
        .btn-create {
            background-color: #0d1117;
            color: white;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create New Treatment</h2>

    <form action="#" method="post">
        <label for="kunjungan">Kunjungan</label>
        <select id="kunjungan" name="kunjungan" required>
            <option value="" disabled selected>Kunjungan</option>
            <option value="KJN001">KJN001</option>
            <option value="KJN002">KJN002</option>
            <option value="KJN003">KJN003</option>
        </select>

        <label for="jenis_perawatan">Jenis Perawatan</label>
        <select id="jenis_perawatan" name="jenis_perawatan" required>
            <option value="" disabled selected>Jenis Perawatan</option>
            <option value="TRM001">TRM001 - Dental Care</option>
            <option value="TRM002">TRM002 - Parasite Control</option>
            <option value="TRM003">TRM003 - Flea Treatment</option>
        </select>

        <label for="catatan_medis">Catatan Medis</label>
        <textarea id="catatan_medis" name="catatan_medis" placeholder="Hewan nya dijaga terus ya!"></textarea>

        <div class="button-group">
            <button type="button" class="btn btn-cancel">Cancel</button>
            <button type="submit" class="btn btn-create">Create</button>
        </div>
    </form>
</div>

</body>
</html>
