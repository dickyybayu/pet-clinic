{% include "navbar.html" %}

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Create New Treatment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      padding-top: 80px;
      background-color: #f5f7fa;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .form-card {
      width: 100%;
      max-width: 600px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 30px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #4a5568;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }

    select, textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .button-group {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .btn-cancel {
      background-color: #f0f2f5;
      color: #4a5568;
      border: 1px solid #d1d5db;
    }

    .btn-create {
      background-color: #5a85e2;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-card">
      <h2>Create New Treatment</h2>

      <form action="{% url 'hijau:create_treatment' %}" method="post">
        {% csrf_token %}

        <label for="kunjungan">Kunjungan</label>
        <select id="kunjungan" name="kunjungan" required>
          <option value="" disabled selected>Pilih Kunjungan</option>
          <option value="KJN001">KJN001</option>
          <option value="KJN002">KJN002</option>
          <option value="KJN003">KJN003</option>
        </select>

        <label for="jenis_perawatan">Jenis Perawatan</label>
        <select id="jenis_perawatan" name="jenis_perawatan" required>
          <option value="" disabled selected>Pilih Jenis Perawatan</option>
          <option value="TRM001">TRM001 - Dental Care</option>
          <option value="TRM002">TRM002 - Parasite Control</option>
          <option value="TRM003">TRM003 - Flea Treatment</option>
        </select>

        <label for="catatan_medis">Catatan Medis</label>
        <textarea id="catatan_medis" name="catatan_medis" placeholder="Contoh: Hewan dalam kondisi baik, lanjut perawatan lanjutan..."></textarea>

        <div class="button-group">
          <a href="{% url 'hijau:list_treatment' %}" class="btn btn-cancel">Cancel</a>
          <button type="submit" class="btn btn-create">Create</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
